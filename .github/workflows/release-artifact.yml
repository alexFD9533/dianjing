name: Release artifact

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build formal extension
        run: pnpm build:dock

      - name: Package unpacked extension
        run: |
          cd apps/dock-extension/dist
          zip -r "../../../dianjing-$GITHUB_REF_NAME.zip" .

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: dianjing-${{ github.ref_name }}
          path: dianjing-${{ github.ref_name }}.zip
